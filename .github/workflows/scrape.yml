name: Scrape band & artist data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to scrape"
        required: true
        default: bands
        type: choice
        options:
          - bands          # ~2 min  — bands only
          - all            # ~15 min — bands + all members

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/visualize-band-data-A8Vrt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Run scraper
        run: |
          if [ "${{ inputs.mode }}" = "all" ]; then
            npm run scrape
          else
            npm run scrape:bands
          fi

      - name: Open review PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="scrape/$(date +%Y%m%d-%H%M)"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/lib/scraped.json
          if git diff --staged --quiet; then
            echo "No new data — nothing to review."
          else
            git commit -m "chore: scraped data (${{ inputs.mode }}, run ${GITHUB_RUN_ID})"
            git push origin "$BRANCH"
            gh pr create \
              --title "Review scraped data (${{ inputs.mode }})" \
              --body "Triggered by workflow run [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

Review the \`src/lib/scraped.json\` diff below, then merge when it looks good." \
              --base claude/visualize-band-data-A8Vrt \
              --head "$BRANCH"
          fi
