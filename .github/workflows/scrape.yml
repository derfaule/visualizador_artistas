name: Scrape band & artist data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to scrape"
        required: true
        default: bands
        type: choice
        options:
          - bands          # ~2 min  — bands only
          - all            # ~15 min — bands + all members

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/visualize-band-data-A8Vrt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Run scraper
        run: |
          if [ "${{ inputs.mode }}" = "all" ]; then
            npm run scrape
          else
            npm run scrape:bands
          fi

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/scraped.json
          git diff --staged --quiet && echo "No changes to commit" || \
            git commit -m "chore: update scraped data (${GITHUB_RUN_ID})"
          git push
